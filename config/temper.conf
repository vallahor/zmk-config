# Keep the active OS layer when the keyboard is idle. Deep sleep reboots ZMK
# on wake, which resets the active layer even though the Bluetooth profile is saved.
CONFIG_ZMK_SLEEP=n

# Better connection and power on Bluetooth
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery level
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
